name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Rerun on main by hand, e.g. when GitHub missed a push event.
  workflow_dispatch:

env:
  # cBioPortal seed dump (genes, aliases, cancer types, reference genomes).
  SEED_URL: https://raw.githubusercontent.com/cBioPortal/datahub/master/seedDB/seed-cbioportal_hg19_hg38_v2.14.5.sql.gz
  SEED_SHA256: da619680669e5b2a8deb2967ebdccaf6369d98336b666b991efcfe47e1960a7a
  # cBioPortal/cbioportal-test: the e2e fixture studies.
  FIXTURES_REF: 8995a9d4d7121969028a93940136aba9599968d0

jobs:
  unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal ops rewrite test)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./internal/... ./cmd/... ./ops/... ./rewrite/...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  contract:
    name: API contract tests
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.3
        env:
          CLICKHOUSE_SKIP_USER_SETUP: 1
        ports:
          - 18123:8123
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/checkout@v4
        with:
          repository: cBioPortal/cbioportal-test
          ref: ${{ env.FIXTURES_REF }}
          path: fixtures
      - name: Download seed
        run: |
          curl -fsSL "$SEED_URL" -o seed.sql.gz
          echo "$SEED_SHA256  seed.sql.gz" | sha256sum -c -
      - name: Build test databases
        run: test/setup_test_db.sh fixtures seed.sql.gz
      - name: Fetch the e2e portal properties
        # The suite's portal.properties at the pinned frontend commit, without
        # checking out the whole frontend submodule.
        run: |
          rev=$(git ls-tree HEAD frontend | awk '{print $3}')
          mkdir -p frontend/end-to-end-test/local/runtime-config
          curl -fsSL "https://raw.githubusercontent.com/cBioPortal/cbioportal-frontend/$rev/end-to-end-test/local/runtime-config/portal.properties" \
            -o frontend/end-to-end-test/local/runtime-config/portal.properties
      - name: Start API
        # Anonymous, as testuser, with study_hg38 readable: the contract tests
        # read its data.
        run: |
          KEYCLOAK=false nohup test/e2e_api.sh > api.log 2>&1 &
          # The wait includes the script's go build.
          for i in $(seq 1 180); do curl -sf http://localhost:18090/health && exit 0; sleep 1; done
          cat api.log; exit 1
      - run: go test ./test/
        env:
          API: http://localhost:18090
      - name: Live ClickHouse tests (parameter round trips, raw sources, study export, import lock, mirror)
        run: go test ./internal/clickhouse/ ./internal/api/... ./internal/studyimport/ ./rewrite/java-v7-to-go/mirror/ -run Live
        env:
          CLICKHOUSE_TEST_URL: http://localhost:18123
      - name: API log
        if: failure()
        run: cat api.log

  image-build:
    name: Image builds (Go stage)
    # The Docker image builds from a copy of the sources (Dockerfile COPY
    # lines); building its Go stage catches files the image misses.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target go .
