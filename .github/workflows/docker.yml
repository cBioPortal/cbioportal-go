name: Docker image

on:
  push:
    branches: [main]
    # A release tag (v0.1.0) gets the image tags 0.1.0 and 0.1.
    tags: ['v*']
    # Docs-only and CI-only pushes don't change the image; skipping them
    # avoids restarting the deployments for nothing.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/e2e.yml'
  # Pull requests labelled `preview` get an image for their preview instance
  # (pr-<N>.gopreview.cbioportal.org): when labelled and on each new commit.
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: docker.io/cbioportal/cbioportal-go

jobs:
  image:
    name: Build and push (linux/amd64, linux/arm64)
    # Pull requests: same-repository ones with the `preview` label only (fork
    # PRs get no Docker Hub credentials), and no rebuild for other labels.
    if: >-
      github.event_name != 'pull_request' || (
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'preview') &&
        (github.event.action != 'labeled' || github.event.label.name == 'preview'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # A pull request's head commit, not GitHub's merge commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
          # The release tags, for git describe.
          fetch-depth: 0
      - name: Image tags and frontend version
        id: meta
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          # main: latest; a pull request: pr-<N>; a release tag vX.Y.Z: X.Y.Z
          # and X.Y. Each also gets sha-<commit>.
          if [ -n "$PR_NUMBER" ]; then
            tags="$IMAGE:pr-$PR_NUMBER"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v=${GITHUB_REF#refs/tags/v}
            tags="$IMAGE:$v"$'\n'"$IMAGE:${v%.*}"
          else
            tags="$IMAGE:latest"
          fi
          { echo "tags<<EOF"; echo "$tags"; echo "$IMAGE:sha-$(git rev-parse --short=7 HEAD)"; echo EOF; } >> "$GITHUB_OUTPUT"
          echo "release=$(git describe --tags --match 'v*' 2>/dev/null)" >> "$GITHUB_OUTPUT"
          echo "version=$(git rev-parse --short=7 HEAD) ($(git log -1 --format=%cI))" >> "$GITHUB_OUTPUT"
          echo "frontend_commit=$(git -C frontend rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "frontend_version=$(git -C frontend describe --always --tags)" >> "$GITHUB_OUTPUT"
      # The built frontend is cached by submodule commit (shared with the e2e
      # workflow) and handed to the image build as the frontend-dist stage,
      # so it is only rebuilt when the frontend changes.
      - name: Cached frontend build
        id: frontend-cache
        uses: actions/cache@v4
        with:
          path: frontend/dist
          key: frontend-dist-${{ steps.meta.outputs.frontend_commit }}-node22.18.0
      - uses: actions/setup-node@v4
        if: steps.frontend-cache.outputs.cache-hit != 'true'
        with:
          node-version: 22.18.0
      - name: Build frontend
        if: steps.frontend-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: corepack enable && pnpm install --frozen-lockfile && pnpm run buildAll
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            RELEASE=${{ steps.meta.outputs.release }}
            FRONTEND_COMMIT=${{ steps.meta.outputs.frontend_commit }}
            FRONTEND_VERSION=${{ steps.meta.outputs.frontend_version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.commit }}
          build-contexts: |
            frontend-dist=frontend/dist
          cache-from: type=gha
          cache-to: type=gha,mode=max
