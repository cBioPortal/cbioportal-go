name: Frontend e2e

# The full cBioPortal Playwright suite (frontend/ submodule) against this
# backend. Heavy (frontend build + ~350 browser tests), so it runs weekly and
# on demand rather than on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

env:
  SEED_URL: https://raw.githubusercontent.com/cBioPortal/datahub/master/seedDB/seed-cbioportal_hg19_hg38_v2.14.5.sql.gz
  SEED_SHA256: da619680669e5b2a8deb2967ebdccaf6369d98336b666b991efcfe47e1960a7a
  FIXTURES_REF: 8995a9d4d7121969028a93940136aba9599968d0

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.3
        env:
          CLICKHOUSE_SKIP_USER_SETUP: 1
        ports:
          - 18123:8123
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: corepack enable
      - uses: actions/checkout@v4
        with:
          repository: cBioPortal/cbioportal-test
          ref: ${{ env.FIXTURES_REF }}
          path: fixtures
      - name: Download seed
        run: |
          curl -fsSL "$SEED_URL" -o seed.sql.gz
          echo "$SEED_SHA256  seed.sql.gz" | sha256sum -c -
      - name: Build test databases
        run: test/setup_test_db.sh fixtures seed.sql.gz
      # The built frontend is cached by submodule commit and shared with the
      # image workflow, so it is only rebuilt when the frontend changes.
      - name: Frontend commit
        id: frontend
        run: echo "commit=$(git -C frontend rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cached frontend build
        id: frontend-cache
        uses: actions/cache@v4
        with:
          path: frontend/dist
          key: frontend-dist-${{ steps.frontend.outputs.commit }}-node22.18.0
      - name: Build frontend
        if: steps.frontend-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm run buildAll
      - name: Install Playwright
        working-directory: frontend/end-to-end-test-playwright
        run: pnpm install --frozen-lockfile --ignore-workspace && pnpm exec playwright install --with-deps chromium
      - name: Start Keycloak
        run: test/keycloak/start.sh
      - name: Start API
        # Logs in through Keycloak as upstream CI's backend does.
        run: |
          nohup test/e2e_api.sh > api.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://localhost:18090/health && exit 0; sleep 1; done
          cat api.log; exit 1
      - name: Run e2e
        # Two workers: the private repo's runner has 2 vCPUs shared with the
        # API, ClickHouse and Keycloak; three overload it and specs miss the
        # tests' 5s waits.
        # hide-download-controls' patient and study view groups wait for the
        # "Files & Links" tab, which frontend v7.2.0 replaces with one tab
        # per resource when the resource table has data. They fail against
        # Java too (cbioportal-frontend's e2e_localdb since v7.2.0).
        env:
          E2E_SKIP: 'hide download controls feature (patient view|study view) '
        run: test/run_e2e.sh 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            frontend/end-to-end-test-playwright/test-results/
            api.log
          retention-days: 7
