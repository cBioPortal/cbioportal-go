<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cBioPortal (Rust) — study browser</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
         color: #14435e; background: #fff; }
  header { background: #2a5980; color: #fff; padding: 12px 20px; display: flex; align-items: baseline; gap: 14px; }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .tag { font-size: 12px; opacity: .8; }
  main { padding: 20px; max-width: 1100px; margin: 0 auto; }
  h2 { font-size: 15px; border-bottom: 2px solid #2a5980; padding-bottom: 4px; margin: 22px 0 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 5px 9px; border-bottom: 1px solid #e3e9ee; }
  th { background: #f2f6f9; color: #2a5980; font-weight: 600; }
  tr.study { cursor: pointer; }
  tr.study:hover { background: #eef6fb; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; background: #eef6fb; border: 1px solid #cfe0ec; color: #2a5980;
          border-radius: 10px; padding: 1px 8px; font-size: 11px; margin: 2px 3px 2px 0; }
  .stat { display: inline-block; margin-right: 26px; }
  .stat .n { font-size: 22px; font-weight: 700; color: #2a5980; }
  .stat .l { font-size: 11px; text-transform: uppercase; color: #6b8496; letter-spacing: .5px; }
  #back { cursor: pointer; color: #2a5980; font-size: 13px; margin-bottom: 6px; display: inline-block; }
  .muted { color: #6b8496; }
</style>
</head>
<body>
<header>
  <h1>cBioPortal</h1>
  <span class="tag">Rust backend · axum + ClickHouse ELT</span>
</header>
<main id="app">Loading…</main>

<script>
const app = document.getElementById('app');
const j = async (p) => (await fetch(p)).json();
const jp = async (p, b) => (await fetch(p, {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(b)})).json();
const esc = (s) => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function studiesView() {
  const studies = await j('/api/studies');
  studies.sort((a,b) => b.allSampleCount - a.allSampleCount);
  app.innerHTML = `<h2>All Studies <span class="muted">(${studies.length})</span></h2>
    <table id="studies"><thead><tr><th>Study</th><th>Cancer Type</th><th class="num">Samples</th></tr></thead>
    <tbody>${studies.map(s => `<tr class="study" data-id="${esc(s.studyId)}">
      <td><b>${esc(s.name)}</b><br><span class="muted">${esc(s.studyId)}</span></td>
      <td><span class="pill">${esc(s.cancerTypeId)}</span></td>
      <td class="num">${s.allSampleCount.toLocaleString()}</td></tr>`).join('')}</tbody></table>`;
  document.querySelectorAll('tr.study').forEach(tr =>
    tr.addEventListener('click', () => { location.hash = 'study=' + tr.dataset.id; }));
}

async function studyView(id) {
  app.innerHTML = 'Loading study…';
  const [study, samples, profiles, panels] = await Promise.all([
    j('/api/studies/' + id), j('/api/studies/' + id + '/samples'),
    j('/api/studies/' + id + '/molecular-profiles'), j('/api/gene-panels'),
  ]);
  const mpid = id + '_mutations';
  const muts = await j('/api/molecular-profiles/' + mpid + '/mutations?pageSize=2000');
  const sequenced = samples.filter(s => s.sequenced).length;
  const cnaSamples = samples.filter(s => s.copyNumberSegmentPresent).length;
  // Top mutated genes.
  const geneCount = {};
  muts.forEach(m => { const g = m.gene.hugoGeneSymbol; geneCount[g] = (geneCount[g]||0)+1; });
  const topGenes = Object.entries(geneCount).sort((a,b)=>b[1]-a[1]).slice(0,15);

  app.innerHTML = `
    <span id="back">&larr; All studies</span>
    <h2>${esc(study.name)}</h2>
    <p class="muted">${esc(study.description)}</p>
    <div>
      <span class="stat"><div class="n">${study.allSampleCount.toLocaleString()}</div><div class="l">Samples</div></span>
      <span class="stat"><div class="n">${sequenced.toLocaleString()}</div><div class="l">Sequenced</div></span>
      <span class="stat"><div class="n">${cnaSamples.toLocaleString()}</div><div class="l">CNA (seg)</div></span>
      <span class="stat"><div class="n">${muts.length.toLocaleString()}</div><div class="l">Mutations</div></span>
      <span class="stat"><div class="n">${profiles.length}</div><div class="l">Profiles</div></span>
    </div>
    <h2>Molecular Profiles</h2>
    <table><thead><tr><th>Profile</th><th>Type</th><th>Datatype</th></tr></thead><tbody>
      ${profiles.map(p => `<tr><td>${esc(p.name)}<br><span class="muted">${esc(p.molecularProfileId)}</span></td>
        <td><span class="pill">${esc(p.molecularAlterationType)}</span></td><td>${esc(p.datatype)}</td></tr>`).join('')}
    </tbody></table>
    <h2>Most Frequently Mutated Genes</h2>
    <table id="genes"><thead><tr><th>Gene</th><th class="num">Mutations</th><th class="num">Freq</th></tr></thead><tbody>
      ${topGenes.map(([g,c]) => `<tr><td><b>${esc(g)}</b></td><td class="num">${c}</td>
        <td class="num">${(100*c/Math.max(sequenced,1)).toFixed(1)}%</td></tr>`).join('')}
    </tbody></table>`;
  document.getElementById('back').addEventListener('click', () => { location.hash = ''; });
  window.__ready = true;
}

async function route() {
  window.__ready = false;
  const m = location.hash.match(/study=([^&]+)/);
  try {
    if (m) await studyView(decodeURIComponent(m[1])); else { await studiesView(); window.__ready = true; }
  } catch (e) { app.innerHTML = '<pre>' + esc(e.stack || e) + '</pre>'; window.__ready = true; }
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
